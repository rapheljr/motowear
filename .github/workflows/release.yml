name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APKs
        run: ./gradlew assembleDebug --no-daemon

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          cp phone/build/outputs/apk/debug/phone-debug.apk release-assets/MotoWear-Phone-Companion.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk release-assets/MotoWear-WearOS-Watch.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/MotoWear-Phone-Companion.apk
            release-assets/MotoWear-WearOS-Watch.apk
          generate_release_notes: true
