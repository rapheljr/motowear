name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: semver
        uses: PaulHatch/semantic-version@v6.0.4
        with:
          branch: main
          tag_prefix: "v"
          major_pattern: "(MAJOR)|BREAKING CHANGE:|feat!:"
          minor_pattern: "feat"
          patch_pattern: "fix"
          format: "${major}.${minor}.${patch}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build APKs with Versioning
        run: ./gradlew assembleDebug -PversionName=${{ steps.semver.outputs.version }} -PversionCode=${{ steps.semver.outputs.version_code }} --no-daemon

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          TAG_NAME="${{ github.ref_name }}"
          cp phone/build/outputs/apk/debug/phone-debug.apk release-assets/MotoWear-Phone-Companion-${TAG_NAME}.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk release-assets/MotoWear-WearOS-Watch-${TAG_NAME}.apk

      - name: Tag and Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release-assets/MotoWear-Phone-Companion-${{ github.ref_name }}.apk
            release-assets/MotoWear-WearOS-Watch-${{ github.ref_name }}.apk
          generate_release_notes: true
