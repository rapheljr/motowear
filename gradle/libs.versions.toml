[versions]
agp = "8.7.2"
kotlin = "2.0.21"
protobufPlugin = "0.10.0"
protobuf = "4.36.2"
coreKtx = "1.19.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
